name = "pdf-insight-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Sekrety (NIE w repozytorium): wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
[vars]
LLM_PROVIDER = "gemini"
# Aktualny model Flash z darmowym planem i obsługą obrazów (gemini-2.5-flash nie jest już
# dostępny dla nowych projektów). Przy niskich limitach darmowych: "gemini-3.5-flash-lite".
GEMINI_MODEL = "gemini-3.8-flash"
# Darmowy plan bywa przeciążony („high demand”, HTTP 503). Wtedy Worker próbuje kolejnych
# modeli; każdy ma osobny limit darmowy. Wszystkie obsługują obrazy (odczyt skanów).
GEMINI_FALLBACK_MODELS = "gemini-3.5-flash,gemini-3.5-flash-lite,gemini-2.5-flash"
# Origin GitHub Pages to sama domena, bez ścieżki repozytorium.
# Localhost NIE jest dopuszczony w produkcji; lokalnie nadpisuje to worker/.dev.vars.
ALLOWED_ORIGINS = "https://aeternifrigus.github.io"

# Limit żądań współdzielony między instancjami workera (10 analiz / 60 s na adres IP).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Osobny limit dla tłumaczeń: tłumaczenie całego dokumentu to kilkanaście krótkich żądań.
[[ratelimits]]
name = "RATE_LIMITER_TRANSLATE"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
