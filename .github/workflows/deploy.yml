name: CI i deploy na GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Wdrożenia na main nie są przerywane w połowie (zalecenie GitHub Pages);
# przerywane są tylko nieaktualne przebiegi dla pull requestów.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, typy i testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Adres backendu: Settings → Secrets and variables → Actions → Variables → VITE_API_URL
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Sprawdź konfigurację
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Brak zmiennej repozytorium VITE_API_URL (adres Cloudflare Workera)."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
