name: Deploy backendu (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/lib/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Workera
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sprawdź sekrety
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Brak CLOUDFLARE_API_TOKEN: pomijam deploy (Worker można wdrożyć ręcznie: npm run deploy:worker)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - run: npm test
        if: steps.check.outputs.skip != 'true'
      - run: npm run deploy:worker
        if: steps.check.outputs.skip != 'true'
